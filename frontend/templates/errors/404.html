{% extends "base.html" %}

{% block title %}Page not found | Kenya Job Platform{% endblock %}

{% block content %}
<section class="error-page">
  <div class="container">
    <p class="error-page__code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <div class="error-page__actions">
      <a class="btn btn--primary btn--lg" href="{% url 'web:home' %}">Back to home</a>
      <a class="btn btn--secondary btn--lg" href="{% url 'web:job-list' %}">Browse jobs</a>
    </div>
  </div>
</section>
{% endblock %}
